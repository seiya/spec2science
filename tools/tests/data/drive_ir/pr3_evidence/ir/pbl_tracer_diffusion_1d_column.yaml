algorithm:
  algorithm_id: pbl_tracer_implicit_diffusion_column
  execution_mode: conditional
  description: 'One call of the published operation on one column of ka cells (k = 1..ka, interior k = ks..ke, the others halo cells
    that the operation does not read): the tendency of the density of one tracer by vertical turbulent diffusion over one backward-Euler
    step, with the surface flux entering the lowest cell, and the face flux. Source: ATMOS_PHY_BL_tendency_tracer of scale_atmos_phy_bl_common
    (scale-met/scale-dev dc58155, double precision, the path without _OPENACC, Thomas solver MATRIX_SOLVER_tridiagonal_1D_TA). Every
    array argument has rank 1 and extent ka; fz(k) is the height of the LOWER face of cell k, kh(k) the diffusivity at the UPPER face
    of cell k.'
  steps:
  - step_id: s01_guard
    step_kind: pointwise_process
    operation_ref: pbl_tracer_input_guard
    inputs:
    - ka
    - ks
    - ke
    - dt
    - dens
    - fz
    - cz
    - kh
    - f2h_above
    - f2h_below
    - sflx_q
    - mass
    outputs:
    - guard_pass
    description: Refuse (guard_pass = false, outputs undefined, return) when ks < 2, ke > ka, ke < ks + 2 or dt <= 0 (these first, so
      that no out-of-range cell is indexed); or dens(k) <= 0 at some k = ks..ke; or fz(k+1) <= fz(k) or cz(k+1) <= cz(k) for some k
      = ks..ke-1; or (f2h_above(k)*dens(k+1) + f2h_below(k)*dens(k))*kh(k) < 0 for some k = ks..ke-1; or dens(ks) + dt*mass*sflx_q/(fz(ks+1)
      - fz(ks)) <= 0. The program is never terminated.
  - step_id: s02_kpbl
    step_kind: diagnostic
    operation_ref: pbl_tracer_top_of_solved_layer
    inputs:
    - kh
    - ks
    - ke
    outputs:
    - kpbl
    description: 'kpbl = ke - 1; then for k = ke-2, ke-3, ..., ks+1 in this order: if kh(k) > 0 then kpbl = k + 1, otherwise stop the
      scan. kpbl lies in ks+1..ke-1; a column with kh > 0 at every face ks+1..ke-2 gets kpbl = ks + 2. This is the source rule as executed
      and is required exactly.'
  - step_id: s03_system
    step_kind: pointwise_process
    operation_ref: pbl_tracer_tridiagonal_coefficients
    inputs:
    - dens
    - qtrc
    - kh
    - cz
    - fz
    - f2h_above
    - f2h_below
    - sflx_q
    - mass
    - dt
    - kpbl
    outputs:
    - sfc
    - rho_star
    - rhokh
    - a_up
    - b_mid
    - c_low
    - d_rhs
    description: 'dz(k) = fz(k+1) - fz(k) for k = ks..kpbl; dzc(k) = cz(k+1) - cz(k) for k = ks..kpbl-1; sfc = sflx_q/dz(ks); rho_star(ks)
      = dens(ks) + dt*sfc*mass, rho_star(k) = dens(k) for k = ks+1..kpbl; rhokh(k) = (f2h_above(k)*dens(k+1) + f2h_below(k)*dens(k))*kh(k)
      for k = ks..kpbl-1 (dens, not rho_star); d_rhs(ks) = (qtrc(ks)*dens(ks) + dt*sfc)/rho_star(ks), d_rhs(k) = qtrc(k) for k = ks+1..kpbl;
      for k = ks..kpbl-1 with p = -dt*rhokh(k)/dzc(k): a_up(k) = p/(rho_star(k)*dz(k)), c_low(k+1) = p/(rho_star(k+1)*dz(k+1)); c_low(ks)
      = 0, a_up(kpbl) = 0; b_mid(k) = 1 - a_up(k) - c_low(k) for k = ks..kpbl.'
  - step_id: s04_solve
    step_kind: iterative_solve
    operation_ref: pbl_tracer_thomas_solve
    inputs:
    - a_up
    - b_mid
    - c_low
    - d_rhs
    - kpbl
    outputs:
    - x_new
    description: 'Solve c_low(k)*x(k-1) + b_mid(k)*x(k) + a_up(k)*x(k+1) = d_rhs(k), k = ks..kpbl, by the Thomas algorithm: g(ks) =
      a_up(ks)/b_mid(ks), h(ks) = d_rhs(ks)/b_mid(ks); for k = ks+1..kpbl-1, r = 1/(b_mid(k) - c_low(k)*g(k-1)), g(k) = a_up(k)*r, h(k)
      = (d_rhs(k) - c_low(k)*h(k-1))*r; x(kpbl) = (d_rhs(kpbl) - c_low(kpbl)*h(kpbl-1))/(b_mid(kpbl) - c_low(kpbl)*g(kpbl-1)); x(k)
      = h(k) - g(k)*x(k+1) for k = kpbl-1 down to ks. A direct, non-iterative solve.'
  - step_id: s05_outputs
    step_kind: diagnostic
    operation_ref: pbl_tracer_outputs
    inputs:
    - x_new
    - qtrc
    - dens
    - rho_star
    - rhokh
    - cz
    - sfc
    - dt
    - kpbl
    outputs:
    - rhoq_t
    - flx
    - guard_pass
    description: rhoq_t(ks) = (x(ks)*rho_star(ks) - qtrc(ks)*dens(ks))/dt - sfc; rhoq_t(k) = (x(k) - qtrc(k))*rho_star(k)/dt for k =
      ks+1..kpbl; rhoq_t(k) = 0 for k = kpbl+1..ke and at every halo cell. flx(k) = -rhokh(k)*(x(k+1) - x(k))/dzc(k) for k = ks..kpbl-1;
      flx = 0 at every other cell 1..ka. guard_pass = true. The surface flux is not added to rhoq_t and not written to flx.
  ordering:
  - s01_guard
  - s02_kpbl
  - s03_system
  - s04_solve
  - s05_outputs
  control_condition:
    dispatch: case_run calls pbl_tracer_diffusion_1d_column__tendency once per case, with grid.ka, grid.ks, grid.ke as ka, ks, ke, time.dt
      as dt, surface.sflx_q as sflx_q and tracer.mass as mass.
    branches:
    - s01_guard refuses -> return with guard_pass false
    - otherwise s02 .. s05
  iteration_contract:
    kind: none
    reason: A single evaluation of one column; the tridiagonal solve is direct.
  update_semantics:
    target_variables:
    - rhoq_t
    - flx
    - guard_pass
    update_order: sequential
    in_place: []
    notes: rhoq_t and flx are intent out (0 at halo cells); guard_pass is a logical out; every other argument is intent in.
  temporaries:
  - name: kpbl
    shape_expr: scalar
  - name: sfc
    shape_expr: scalar
  - name: rho_star
    shape_expr: '[ka]'
  - name: rhokh
    shape_expr: '[ka]'
