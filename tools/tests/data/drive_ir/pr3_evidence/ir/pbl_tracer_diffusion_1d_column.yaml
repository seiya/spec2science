  derived_field_rules:
  - name: case_initial_state
    expression: 'For every state variable X: X(k) = initial.fill.X at every k = 1..ka; then an initial.columns.X rule replaces cells
      k = 2..9 (built with ks = 2, ke = 9 whatever grid.ks, grid.ke the case passes): [a, b] gives X(k) = a + b*(k - 2); {cells: [v1..v10]}
      gives X(k) = v_k literally. Each initial.overrides entry {var, k, value} sets X(k) = value after every other rule.'
    description: case_setup builds the bound state from the case inputs; rhoq_t and flx start at the sentinel -999.
  - name: guard_pass_record
    expression: guard_pass = 1.0 when the operation returned true, 0.0 when it returned false
    description: The logical result recorded as a number.
  - name: perf_counters
    expression: steps = 1; cells_updated = ke - ks + 1 on an accepted call, 0 on a refused one
    description: case_run's perf counters for a single-evaluation component.
  invariants:
  - rhoq_t and flx hold 0 at every halo cell on an accepted call; no halo cell is read.
  - 'rhoq_t(k)*(fz(k+1) - fz(k)) = -(flx(k) - flx(k-1)) for k = ks..kpbl with flx(ks-1) read as 0, so the column integral of rhoq_t
    is 0: the surface flux carries no net tendency.'
  - flx is the backward-Euler flux, evaluated with the new mixing ratio.
  - 'Cells kpbl+1..ke are never solved: rhoq_t = 0 there and flx = 0 at faces kpbl..ke, whatever kh holds.'
  - The program is never terminated on a refusal, an invalid input is never silently completed, and no non-finite value is published.
  - 'AD readiness: the scan for kpbl and the refusal are non-differentiable operations.'
